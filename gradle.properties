#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# com.google.ai.edge.litert:litert and :litert-api both declare the namespace
# com.google.ai.edge.litert. That is only a warning when building a library, but a
# hard manifest-merger error for an application. Both artifacts are required: litert
# ships the runtime (libLiteRt.so), litert-api ships the CompiledModel classes.
android.uniquePackageNames=false

#Kotlin/Native
kotlin.mpp.enableCInteropCommonization=true
